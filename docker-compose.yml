services:
  prorope-frontend:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://prorope.id}
    container_name: prorope-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      prorope-backend:
        condition: service_healthy
    networks:
      - zenit_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  prorope-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: prorope-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /app/data/prorope.db
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@prorope.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-before-production}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-before-production}
    volumes:
      - prorope_data:/app/data
    networks:
      - zenit_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

volumes:
  prorope_data:

networks:
  zenit_net:
    external: true
    name: malabar-trail-run_zenit_net
