services:
  backend:
    build: ./apps/backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /app/data/prorope.db
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAIL: admin@prorope.id
      ADMIN_PASSWORD: prorope123
      AUTH_SECRET: change-this-before-production
    volumes:
      - prorope_data:/app/data

volumes:
  prorope_data:
